<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click the Target Game</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #222;
    font-family: sans-serif;
    color: #fff;
    text-align: center;
  }
  #score {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 24px;
  }
  #target {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: red;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<div id="target"></div>

<script>
let score = 0;
const target = document.getElementById('target');
const scoreDisplay = document.getElementById('score');

function moveTarget() {
  const x = Math.random() * (window.innerWidth - 50);
  const y = Math.random() * (window.innerHeight - 50);
  target.style.left = x + 'px';
  target.style.top = y + 'px';
}

target.addEventListener('click', () => {
  score++;
  scoreDisplay.textContent = 'Score: ' + score;
  moveTarget();
});

setInterval(moveTarget, 2000); // Move target every 2 seconds
moveTarget();
</script>
</body>
</html>
